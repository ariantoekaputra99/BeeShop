services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: beeshop
      POSTGRES_USER: beeuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bee123}
    ports: ['5433:5432']
    volumes: [beeshop_data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U beeuser -d beeshop']
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      postgres: { condition: service_healthy }
    env_file: [.env]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/beeshop
      SPRING_DATASOURCE_USERNAME: beeuser
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-bee123}
    ports: ['8081:8081']
    profiles: [app]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8081/api}
    depends_on: [backend]
    ports: ['5173:80']
    profiles: [app]

volumes:
  beeshop_data: {}
