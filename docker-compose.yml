# Untuk LOCAL saja. SIT/UAT/PROD dideploy dengan image + env dari secret manager
# (lihat env/*.env.example).
#
#   docker compose up -d postgres            # hanya database, backend & frontend jalan dari IDE/terminal
#   docker compose --profile app up --build  # semuanya di container
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: beeshop
      POSTGRES_USER: beeuser
      POSTGRES_PASSWORD: bee123
    ports: ['5433:5432']
    volumes: [beeshop_data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U beeuser -d beeshop']
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      postgres: { condition: service_healthy }
    env_file:
      - path: env/local.env
      - path: env/local.override.env
        required: false
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/beeshop
    ports: ['8081:8081']
    profiles: [app]

  frontend:
    build:
      context: ./frontend
      args:
        BUILD_MODE: development
    depends_on: [backend]
    ports: ['5173:80']
    profiles: [app]

volumes:
  beeshop_data: {}
