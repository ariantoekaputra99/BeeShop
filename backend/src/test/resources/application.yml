spring:
  datasource:
    url: jdbc:h2:mem:beeshop;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
app:
  cors-origins: http://localhost:5173
  storefront-url: http://localhost:5173
  admin-api-key: test-admin-key
  integration-api-key: test-integration-key
  seed-demo-data: false
  order:
    payment-timeout-minutes: 60
    expiry-enabled: false
  payment:
    provider: mock
  shipping:
    provider: mock
    origin-city: Jakarta
